name: Publicar a carta no GitHub Pages

# O site é servido pelo branch gh-pages (Settings → Pages → Deploy from a branch).
# Este workflow reconstrói index.html a partir de dados/ e republica esse branch
# a cada push, para que a carta no ar nunca fique atrás dos dados.

on:
  push:
    branches: [claude/slave-trade-route-maps-ssz5s4]
    paths:
      - 'dados/**'
      - 'build/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar o repositório
        uses: actions/checkout@v4

      - name: Reconstruir index.html a partir dos dados
        run: node build/gerar.mjs

      - name: Conferir que a carta foi gerada
        run: |
          test -s index.html
          grep -q 'window.DADOS' index.html
          grep -q 'painel-escravidao' index.html
          grep -q 'painel-ouro' index.html
          grep -q 'Carta VI' index.html

      - name: Gerar o PDF da carta
        id: pdf
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node build/gerar_pdf.mjs

      - name: Aviso se o PDF não pôde ser regerado
        if: steps.pdf.outcome != 'success'
        run: echo "::warning::PDF não regerado nesta execução; o site usa a versão versionada no repositório."

      - name: Montar o conteúdo do site
        run: |
          rm -rf site && mkdir site
          cp index.html README.md site/
          cp -r dados site/
          cp carta-do-trafico-atlantico.pdf site/
          touch site/.nojekyll

      - name: Republicar o branch gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site publicado a partir de ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
